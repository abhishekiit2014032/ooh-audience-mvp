# Area signals page and adjust the campaign forecast when enabled. Effect sizes come from config.
#
# type: full_closure | partial_closure | roadworks | major_event
# corridor: must match a placement corridor (e.g. "Sheikh Zayed Road", "Al Khail Road") for road events
# areas: area names (e.g. "Dubai Marina") for major events
# placements: optional list of face ids when the source names the exact section
