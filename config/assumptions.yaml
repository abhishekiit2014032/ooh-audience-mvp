# Every parameter the model uses. Each one has a label (VERIFIED / ESTIMATE / ASSUMPTION),
# a source and, where it drives the low / base / high range, a low and a high value.
# The dashboard builds a sidebar control for every scalar parameter below; changing it
# recomputes all pages. Low / high values scale with the base value when you move a slider.

parameters:
  # ---------------------------------------------------------------- traffic
  vehicles_per_lane_per_hour:
    value: 2000
    label: VERIFIED
    group: Traffic
    unit: vehicles / lane / hour
    min: 1200
    max: 2400
    step: 50
    description: Lane capacity. Matches RTA's up to 14,000 vehicles per hour on the widened 7-lane stretch.
    source: RTA via Time Out Dubai (7th lane on Sheikh Zayed Road)
    source_url: https://www.timeoutdubai.com
  utilisation:
    value: 0.40
    low: 0.30
    high: 0.50
    label: ASSUMPTION
    group: Traffic
    unit: share of 24h capacity
    min: 0.05
    max: 0.95
    step: 0.01
    description: Average share of lane capacity used over 24 hours on motorways and trunk roads.
    source: Solution design doc, Step 4
  # ---------------------------------------------------------------- audience
  occupancy:
    value: 1.5
    low: 1.3
    high: 1.7
    label: ASSUMPTION
    group: Audience
    unit: people / vehicle
    min: 1.0
    max: 3.0
    step: 0.05
    description: People per vehicle.
    source: Solution design doc, Step 5
  monthly_frequency:
    value: 8
    low: 12
    high: 5
    label: ASSUMPTION
    group: Audience
    unit: passes / person / month
    min: 1
    max: 30
    step: 0.5
    description: How often the average person passes the same face in a month. The weakest input; Phase 2 measures it with mobile data.
    source: Solution design doc, Step 5
  metro_window_factor:
    value: 0.5
    label: ASSUMPTION
    group: Audience
    unit: share of riders
    min: 0.0
    max: 1.0
    step: 0.05
    description: Share of metro riders who can see the face through a window (only when the track lies inside the cone).
    source: Solution design doc, Step 5
  interest_share:
    value: 0.30
    label: ASSUMPTION
    group: Audience
    unit: share of unique audience
    min: 0.01
    max: 1.0
    step: 0.01
    description: Share of the unique audience interested in the brand category (cars / SUVs). Replaced by Meta values once they are entered in data/inputs/meta_reach.json.
    source: Solution design doc, Audience profiling
  days_per_month:
    value: 30
    label: ASSUMPTION
    group: Audience
    unit: days
    min: 28
    max: 31
    step: 1
    description: Days used to turn daily impressions into monthly impressions.
    source: Solution design doc, Step 5
  # ---------------------------------------------------------------- geometry / visibility
  cone_radius_m:
    value: 400
    label: ASSUMPTION
    group: Visibility
    unit: m
    min: 100
    max: 800
    step: 25
    description: Exposure cone radius for highway hoardings (150 m for street furniture).
    source: Solution design doc, Step 1
  half_angle_deg:
    value: 35
    label: ASSUMPTION
    group: Visibility
    unit: degrees
    min: 10
    max: 80
    step: 1
    description: Half-angle of the exposure cone around the facing bearing.
    source: Solution design doc, Step 1
  heading_tolerance_deg:
    value: 60
    label: ASSUMPTION
    group: Visibility
    unit: degrees
    min: 20
    max: 90
    step: 5
    description: Maximum angle between a segment's travel bearing and the bearing to the hoarding. Opposite-direction traffic is excluded.
    source: Solution design doc, Step 2
  obstruction_factor:
    value: 0.3
    label: ASSUMPTION
    group: Visibility
    unit: visibility multiplier
    min: 0.0
    max: 1.0
    step: 0.05
    description: Visibility kept when the line of sight crosses an OSM building footprint.
    source: Solution design doc, Step 3
  full_size_area_m2:
    value: 100
    label: ASSUMPTION
    group: Visibility
    unit: m²
    min: 20
    max: 300
    step: 5
    description: Face area that earns the full size score S = 1.
    source: Solution design doc, Step 3
  full_dwell_seconds:
    value: 3
    label: ASSUMPTION
    group: Visibility
    unit: seconds
    min: 1
    max: 10
    step: 0.5
    description: Viewing time that earns the full dwell score T = 1.
    source: Solution design doc, Step 3
  speed_factor_of_maxspeed:
    value: 0.8
    label: ASSUMPTION
    group: Visibility
    unit: share of speed limit
    min: 0.3
    max: 1.2
    step: 0.05
    description: Average speed as a share of the OSM speed limit, used when no TomTom speed is available.
    source: Solution design doc, Step 3
  metro_speed_kmh:
    value: 60
    label: ASSUMPTION
    group: Visibility
    unit: km/h
    min: 20
    max: 90
    step: 5
    description: Average metro speed past the face, for the metro dwell score.
    source: Assumption (Dubai Metro average operating speed range)
  segment_length_m:
    value: 25
    label: ASSUMPTION
    group: Visibility
    unit: m
    min: 25
    max: 25
    step: 1
    description: Length of the directed road segments. Fixed because segments are cut once and cached.
    source: Solution design doc, Step 2
  # ---------------------------------------------------------------- duplication
  same_corridor_tau:
    value: 0.5
    label: ASSUMPTION
    group: Duplication
    unit: share of smaller audience
    min: 0.0
    max: 1.0
    step: 0.05
    description: Through-traffic share between two hoardings on the same corridor and direction within the corridor distance.
    source: Solution design doc, Step 7
  different_corridor_tau:
    value: 0.1
    label: ASSUMPTION
    group: Duplication
    unit: share of smaller audience
    min: 0.0
    max: 1.0
    step: 0.05
    description: Overlap share for any other pair of placements.
    source: Solution design doc, Step 7
  corridor_max_km:
    value: 15
    label: ASSUMPTION
    group: Duplication
    unit: km
    min: 1
    max: 50
    step: 1
    description: Maximum distance for the same-corridor overlap rule.
    source: Solution design doc, Step 7
  # ---------------------------------------------------------------- delivery / validation
  triangulation_flag_ratio:
    value: 3
    label: ASSUMPTION
    group: Validation
    unit: ratio
    min: 1.5
    max: 10
    step: 0.5
    description: Flag a placement when computed unique audience and Meta reach estimate differ by more than this factor.
    source: Solution design doc, Step 9
  sample_actual_min:
    value: 0.85
    label: ASSUMPTION
    group: Delivery
    unit: actual / plan
    min: 0.5
    max: 1.0
    step: 0.01
    description: Lower bound of the simulated actual-versus-plan factor (used only without a TomTom key; output is SAMPLE).
    source: Solution design doc, Pipeline step 10
  sample_actual_max:
    value: 1.10
    label: ASSUMPTION
    group: Delivery
    unit: actual / plan
    min: 1.0
    max: 1.5
    step: 0.01
    description: Upper bound of the simulated actual-versus-plan factor.
    source: Solution design doc, Pipeline step 10

# Per road class: lanes per direction when OSM has no lanes tag, a utilisation multiplier
# relative to the motorway utilisation above, and a fallback speed when OSM has no maxspeed.
# All ASSUMPTIONS. Motorway 5 / trunk 4 / primary 3 lanes come from the solution design doc.
road_classes:
  motorway:       {lanes: 5, utilisation_factor: 1.00, speed_kmh: 100}
  trunk:          {lanes: 4, utilisation_factor: 1.00, speed_kmh: 80}
  primary:        {lanes: 3, utilisation_factor: 0.80, speed_kmh: 60}
  secondary:      {lanes: 2, utilisation_factor: 0.60, speed_kmh: 60}
  tertiary:       {lanes: 2, utilisation_factor: 0.50, speed_kmh: 50}
  motorway_link:  {lanes: 1, utilisation_factor: 0.60, speed_kmh: 60}
  trunk_link:     {lanes: 1, utilisation_factor: 0.60, speed_kmh: 50}
  primary_link:   {lanes: 1, utilisation_factor: 0.50, speed_kmh: 40}
  secondary_link: {lanes: 1, utilisation_factor: 0.40, speed_kmh: 40}
  tertiary_link:  {lanes: 1, utilisation_factor: 0.30, speed_kmh: 40}
  residential:    {lanes: 1, utilisation_factor: 0.10, speed_kmh: 30}
  unclassified:   {lanes: 1, utilisation_factor: 0.10, speed_kmh: 30}
  living_street:  {lanes: 1, utilisation_factor: 0.05, speed_kmh: 20}
  default:        {lanes: 1, utilisation_factor: 0.10, speed_kmh: 30}

# Share of daily traffic in each hour (00:00 .. 23:00). Default commuter curve, ASSUMPTION.
# Weekday peaks at 8 am and 6 pm. Peak share stays under 1/12 so that the base and high
# utilisation cases fit inside hourly lane capacity; any excess is clipped and flagged.
hourly_profile:
  label: ASSUMPTION
  source: Default commuter curve (solution design doc, Step 4); replaced by the TomTom hourly profile when available
  shares: [0.012, 0.008, 0.006, 0.005, 0.007, 0.015, 0.038, 0.066, 0.075, 0.062, 0.050, 0.047,
           0.047, 0.047, 0.048, 0.053, 0.062, 0.071, 0.075, 0.065, 0.051, 0.040, 0.030, 0.021]
