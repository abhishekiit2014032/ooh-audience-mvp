# Knowledge layer: how facts from every data source are filed, which ones matter for a campaign,
# and how locations are scored. Everything here is a readable rule (ASSUMPTION), not a model.
#
# A fact = one number or statement about a location (or about all of Dubai), with its source,
# trust label, topic, tags and the outcomes it feeds. Facts are campaign-free; the selector below
# picks the ones that matter for the campaign the user chose.

topics:
  traffic:     {label: Traffic,            icon: "🚗", base: 0.5}
  visibility:  {label: Visibility & dwell, icon: "👁️", base: 0.45}
  audience:    {label: Who passes,         icon: "👥", base: 0.45}
  places:      {label: Places nearby,      icon: "🏬", base: 0.25}
  crowds:      {label: Crowds & events,    icon: "🎟️", base: 0.3}
  growth:      {label: Area growth,        icon: "🏗️", base: 0.25}
  media:       {label: Format & price level,     icon: "🪧", base: 0.5}
  road_events: {label: Road events,        icon: "🚧", base: 0.35}
  delivery:    {label: Delivery,           icon: "📦", base: 0.4}

outcomes:
  reach:    {label: Everyone passing,  icon: "👥"}
  target:   {label: Campaign audience, icon: "🎯"}
  value:    {label: Value (audience per price level), icon: "💎"}
  fit:      {label: Audience fit,      icon: "🧩"}
  timing:   {label: Crowd timing,      icon: "📅"}
  forecast: {label: Delivery forecast, icon: "📈"}
  profile:  {label: Audience profile,  icon: "🪪"}

# Relevance of a fact for a campaign = topic base
#   + tag_match    when the fact's tags meet the campaign's tags
#   + in_window    when a dated fact falls inside the campaign window
#   x out_window   when a dated fact falls outside it
#   - weak         for venue capacities, old figures (> 2 years) and placeholder inputs
# Core facts (the numbers every plan rests on) are always 1.0. Facts tagged for another
# campaign's audience are 0. A fact is "used" when its relevance reaches `threshold`.
relevance:
  tag_match: 0.4
  in_window: 0.35
  out_window: 0.3
  weak: 0.2
  threshold: 0.6

# Tags each campaign cares about (the fact tags that raise relevance).
# Three industries on purpose: a car launch, a property launch and a retail festival read different facts.
campaign_tags:
  suv_launch:      [cars, families, drivers]
  property_launch: [property, premium, business, luxury]
  retail_festival: [shopping, families, tourists, leisure]
  default:         [cars]

# Location scoring (Score & compare). Each criterion is 0-100 relative to the best location.
# Weights are the defaults per campaign; the page lets the user move them.
criteria:
  target:     {label: Campaign audience, icon: "🎯", help: "Campaign audience reached a month (relative to the best board)"}
  value:      {label: Value,             icon: "💎", help: "Campaign audience per price level (our 1-4 rating, no prices)"}
  fit:        {label: Audience fit,      icon: "🧩", help: "Local signals that match the campaign (see fit signals)"}
  timing:     {label: Crowd timing,      icon: "📅", help: "Extra campaign audience from sourced crowd events in the window"}
  confidence: {label: Data confidence,   icon: "🔍", help: "How solid the facts behind this board are (share of verified and estimated vs placeholder)"}

weights:
  suv_launch:      {target: 30, value: 30, fit: 20, timing: 10, confidence: 10}   # reach car fans at a sensible price level
  property_launch: {target: 20, value: 20, fit: 40, timing: 10, confidence: 10}   # the right districts first
  retail_festival: {target: 30, value: 25, fit: 25, timing: 15, confidence: 5}    # crowds near malls, in season
  default:         {target: 30, value: 30, fit: 20, timing: 10, confidence: 10}

# Audience fit = weighted average of local signals, each scaled 0-1 against the best location.
#   poi:<category>  points of interest within 1 km (OpenStreetMap)
#   premium         premium-area flag (DIFC, Downtown, Marina; ASSUMPTION)
#   road_share      share of views from road traffic (drivers)
#   commuters       share of traffic in the rush hours
fit_signals:
  suv_launch:      {"poi:Car showrooms and services": 0.5, "poi:Retail and malls": 0.2, road_share: 0.3}
  property_launch: {premium: 0.45, "poi:Offices and business": 0.3, "poi:Hotels and tourism": 0.1, commuters: 0.15}
  retail_festival: {"poi:Retail and malls": 0.5, "poi:Food and leisure": 0.3, "poi:Hotels and tourism": 0.2}
  default:         {"poi:Car showrooms and services": 0.5, road_share: 0.5}

# Crowd timing: extra campaign audience from crowds as a share of the board's monthly campaign
# audience. This share earns the full 100 (smaller effects score proportionally).
timing_full_share: 0.05

# Trust of a fact, for the confidence criterion and the flow diagram.
trust_weight: {VERIFIED: 1.0, ESTIMATE: 0.75, ASSUMPTION: 0.5, SAMPLE: 0.35, CONCEPT: 0.1}
